server {
    listen 8080;
    listen [::]:8080;
    root /usr/share/nginx/html;
    index index.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;

    location ^~ /pathway/content/ {
        deny all;
        return 404;
    }
    location ^~ /team/advising/ {
        auth_basic "Northstar team";
        auth_basic_user_file /etc/nginx/.team.htpasswd;
        try_files $uri $uri/ /team/advising/index.html;
    }
    location = /team/advising {
        return 301 /team/advising/;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
